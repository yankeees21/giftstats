<script>

const $=s=>document.querySelector(s),I=d=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`,
TABS=[['sum',I('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),'Обзор'],['sig',I('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),'Сигналы'],['dem',I('<rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/>'),'Рынок'],['fav',I('<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1.2"/>'),'Мои']];
const SORT={vol:'Объём',flr:'Флор',up:'Рост',dn:'Падение',spr:'Спред'},KIND={col:' Подарки',model:' Модели',backdrop:' Фоны',symbol:' Узоры',combo:' Связки'},DS={sl:' Продажи',tv:' Оборот',gr:' Рост',sp:' Скорость'};
let S={view:'grid',tab:'sum',sort:'vol',kind:'col',ds:'sl',p:'24h',live:false,q:'',data:null},timer;
const PER={'24h':'24ч','7d':'7 дней','30d':'30 дней'},PL={'24h':'24ч','7d':'7д','30d':'30д'};
const Q=n=>JSON.stringify(n).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let FAV=new Set();try{FAV=new Set(JSON.parse(localStorage.getItem('fav')||'[]'))}catch(e){}
const tf=n=>{FAV.has(n)?FAV.delete(n):FAV.add(n);try{localStorage.setItem('fav',JSON.stringify([...FAV]))}catch(e){}h();go()};
const STAR=f=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;
async function post(p,b){try{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':tg?tg.initData:''},body:JSON.stringify(b)});if(r.ok)return true;let j={};try{j=await r.json()}catch(_){}S.perr='HTTP '+r.status+(j.detail?' · '+j.detail:j.error?' · '+j.error:'');return false}catch(e){S.perr=String(e);return false}}
async function setAlert(n,d){const v=+$('#ap').value;if(!(v>0))return;const ok=await post('alert',{name:n,dir:d,price:v});const m=ok?'Готово: бот напишет, когда флор '+(d==='lte'?'опустится до ':'поднимется до ')+v+' TON':'Не удалось сохранить уведомление';tg&&tg.showAlert?tg.showAlert(m):alert(m)}
const VIEW={grid:'Плитки',list:'Список'};
const GRID=it=>`<div class="grid">${it.map((x,i)=>`<div class="tile" style="animation-delay:${Math.min(i,12)*30}ms" onclick="openGift(${Q(x.name)})">${ava(x.name)}<button class="st tstar ${FAV.has(x.name)?'on':''}" onclick="event.stopPropagation();tf(${Q(x.name)})">${STAR(FAV.has(x.name))}</button><div class="tn">${x.name}</div><div class="tp"><b>${fp(x.floor)}</b>${chip(x.chg)}</div></div>`).join('')}</div>`;
const bl=b=>{const f=k=>b&&b[k]&&b[k][0]?b[k][0].v:null,x=[['Модель',f('model')],['Фон',f('backdrop')],['Узор',f('symbol')]].filter(a=>a[1]);return x.length?`<div class="sub" style="margin-top:4px">${x.map(a=>a[0]+': <b style="color:var(--fg)">'+a[1]+'</b>').join(' · ')}</div>`:''};
function bestBlock(b){if(!b)return'';const c=(t,x)=>x?`<div class="bt"><small>${t}</small><b>${x.v}</b><div class="sub">флор ${fp(x.floor)}${x.disc!=null&&x.disc>0?' · ниже средней цены продаж на '+x.disc.toFixed(0)+'%':''}${x.sold?' · продаж '+x.sold:''}</div>${chip(x.chg)}</div>`:'';
return `<div class="best"><div class="bh">Самая выгодная</div><div class="bgrid">${c('Модель',(b.model||[])[0])}${c('Фон',(b.backdrop||[])[0])}${c('Узор',(b.symbol||[])[0])}</div></div>`+((b.model||[]).length?'':'<div class="note">Данных о продажах пока мало: рейтинг появится после нескольких кругов обхода.</div>')}
function modelsTable(b){const r=b&&b.model;if(!r||!r.length)return'';const mx=Math.max(...r.map(x=>x.score),1);
return `<div class="card"><div class="lead"><b>Все модели коллекции</b></div><table><tr><th>Модель</th><th>Флор</th><th>%</th><th>Пр</th><th>Выгода</th></tr>${r.map(x=>`<tr><td>${x.v}<i class="bar" style="--w:${Math.max(4,100*x.score/mx)}%"></i></td><td>${fp(x.floor)}</td><td>${chip(x.chg)}</td><td>${x.sold||'·'}</td><td>${x.disc==null?'—':(x.disc>0?'+':'')+x.disc.toFixed(0)+'%'}</td></tr>`).join('')}</table><div class="note">Выгода: насколько флор модели ниже средней цены, за которую такие лоты уходят. Индекс: продажи × рост × выгода.</div></div>`}
const SC={BUY:'up',WATCH:'wt',AVOID:'dn'},agoS=t=>{if(!t)return'нет данных';const d=Math.max(0,Date.now()/1000-t);return d<90?Math.round(d)+' с назад':d<5400?Math.round(d/60)+' мин назад':Math.round(d/3600)+' ч назад'};
async function postj(p,b){try{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':tg?tg.initData:''},body:JSON.stringify(b)});return r.ok?await r.json():null}catch(e){return null}}
async function explain(btn,js){const x=JSON.parse(js),el=btn.closest('.sig').querySelector('.ex');el.innerHTML='<div class="note">Считаю…</div>';const r=await postj('ai/explain',{gift:x.gift,score:x.score,signal:x.signal,data:x.metrics});el.innerHTML=r?`<div class="note" style="color:var(--fg)">${r.text}</div>`:'<div class="note">Пояснение недоступно</div>'}
function sigCard(x){const m=x.metrics;return `<div class="card sig"><div style="display:flex;gap:12px;align-items:center">${ava(x.gift)}<div><div class="nm">${x.gift}</div><div class="sub">${fp(m.floor)} TON · ${agoS(x.updated_at)}${x.stale?' · данные устарели':''}</div></div><div class="r"><span class="chip ${SC[x.signal]}">${x.signal}</span><div class="sub">Score <b>${x.score}</b>/100</div></div></div>
<div class="lead" style="margin-top:8px">${chip(m.chg)} · ${m.sold} продаж${m.avg_sale?' · ср. цена ухода '+fp(m.avg_sale)+' TON':''}${m.discount!=null?' · floor '+(m.discount>0?'ниже':'выше')+' средней продажи на '+Math.abs(m.discount).toFixed(0)+'%':''}</div>
<div class="note" style="margin:2px 0 6px">${x.conf_label} (${x.confidence}) · ${m.sold} продаж, ${m.markets} маркет(а)</div><ul class="rs">${x.reasons.map(r=>`<li>${r}</li>`).join('')}</ul>
<div style="display:flex;gap:8px"><button class="btn" style="margin:0" onclick="openGift(${Q(x.gift)})">Подробнее</button><button class="btn gh" style="margin:0" onclick="explain(this,${Q(JSON.stringify(x))})">Пояснить</button></div><div class="ex"></div></div>`}
const noSig=sg=>`<div class="card"><div class="lead">${sg&&sg.items?`Недостаточно данных для сигналов${sg.insufficient?': у '+sg.insufficient+' подарков мало продаж':''}. Бот собирает продажи по кругу, нужно время.`:'Нет связи с сервером'}</div></div>`;
const sigBlock=sg=>{const t=((sg&&sg.items)||[]).filter(x=>x.signal==='BUY').slice(0,3);return `<h3>Что купить сейчас</h3>`+(t.length?t.map(sigCard).join(''):noSig(sg))};
const sigAll=sg=>`<h3>Сигналы</h3>`+(((sg&&sg.items)||[]).length?sg.items.map(sigCard).join(''):noSig(sg))+`<div class="note">Сигналы BUY / WATCH / AVOID — аналитическая оценка по данным маркетов, а не обещание прибыли.</div>`;
const arbBlock=a=>`<h3>Возможности</h3>`+(((a&&a.items)||[]).length?a.items.slice(0,10).map(r=>`<div class="card"><b>${r.gift}</b><table><tr><td>${r.buy_market}</td><td>${fp(r.buy_price)} TON</td></tr><tr><td>${r.sell_market}</td><td>${fp(r.sell_price)} TON</td></tr></table><div class="lead">Разница ${chip(r.spread_percent)} · потенциально +${fp(r.estimated_profit)} TON (${r.estimated_profit_percent.toFixed(1)}%)</div><div class="sub">${agoS(r.updated_at)}${a.fees_known?'':' · комиссии маркетов не учтены (не заданы)'}</div></div>`).join(''):'<div class="card"><div class="lead">Сейчас разницы между маркетами нет или данных меньше чем с двух источников.</div></div>');
const anomBlock=a=>`<h3>Аномалии</h3>`+(((a&&a.items)||[]).length?a.items.map(r=>`<div class="card"><b>${r.gift}</b><div class="lead">${r.metrics.floor_chg!=null?'Floor '+chip(r.metrics.floor_chg)+' ':''}${r.metrics.sales_change!=null?'· продажи '+chip(r.metrics.sales_change)+' ('+r.metrics.sales_recent+' за 3 ч) ':''}${r.metrics.volume_change!=null?'· объём '+chip(r.metrics.volume_change):''}</div><div class="note" style="margin:0;color:var(--fg)">${r.verdict}</div></div>`).join(''):'<div class="card"><div class="lead">Аномалий не обнаружено или данных недостаточно.</div></div>');
const favBlock=d=>`<h3>Избранное</h3>`+((d&&d.items||[]).length?d.items.map(x=>`<div class="item" onclick="openGift(${Q(x.gift)})">${ava(x.gift)}<div><div class="nm">${x.gift}</div><div class="sub">${x.no_data?'Нет актуальных данных':agoS(x.updated_at)+(x.stale?' · данные устарели':'')}</div></div><div class="r">${x.no_data?'':`<b>${fp(x.floor)}</b><br>${chip(x.chg)}`}${x.signal?` <span class="chip ${SC[x.signal]}">${x.signal} ${x.score}</span>`:x.no_data?'':'<div class="sub">Недостаточно данных</div>'}</div></div>`).join(''):'<div class="card"><div class="lead">Добавь подарки звёздочкой в списке.</div></div>');
const mkStrip=m=>`<div class="strip">${((m&&m.items)||[]).map(x=>`<span><i class="dot ${x.st||'wait'}"></i>${x.name}${x.st==='ok'||x.st==='wait'?'':' · '+E(x.ok).slice(0,26)}</span>`).join('')}</div>`;
const salesBlock=d=>{const a=d.sales&&d.sales.d1,b=d.sales&&d.sales.d7;if(!a||!a.span_h)return'<div class="card"><div class="lead">Продажи: недостаточно данных (подарок вне топа слежения).</div></div>';
const v=x=>x.velocity==null?'—':`${x.n} за ${x.span_h.toFixed(1)} ч ≈ ${x.velocity.toFixed(2)} / час`;return `<div class="card"><div class="lead"><b>Продажи</b></div><table><tr><td>За 24ч</td><td>${a.n}</td></tr><tr><td>За 7д</td><td>${b.n}</td></tr><tr><td>Средняя / медиана</td><td>${fp(a.avg)} / ${fp(a.median)}</td></tr><tr><td>Мин / макс</td><td>${fp(a.min)} / ${fp(a.max)}</td></tr><tr><td>Объём</td><td>${fp(a.volume)} TON</td></tr><tr><td>Скорость</td><td>${v(a)}</td></tr></table>${d.signal?`<div class="lead">Сигнал <span class="chip ${SC[d.signal.signal]}">${d.signal.signal} ${d.signal.score}</span> · ${d.signal.conf_label}</div>`:''}</div>`};
function tip(e){const sv=$('#ch'),C=window.CH;if(!sv||!C)return;const r=sv.getBoundingClientRect(),k=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),i=Math.round(k*(C.s.length-1)),x=i*300/(C.s.length-1),y=C.y(C.s[i]);
$('#tp').style.display='';$('#tl').setAttribute('x1',x);$('#tl').setAttribute('x2',x);$('#tc').setAttribute('cx',x);$('#tc').setAttribute('cy',y);const ago=C.span*(1-i/(C.s.length-1));

const AT={floor_lte:'Floor ниже, TON',floor_gte:'Floor выше, TON',chg_up:'Рост больше, %',chg_down:'Падение больше, %',sales_gt:'Продаж за 24ч больше',volume_gt:'Объём больше, TON',arb_gt:'Арбитраж больше, %',signal_buy:'Сигнал BUY',anomaly:'Аномалия'};

async function addRule(n){const t=$('#rt').value,v=+$('#rv').value;if(!noVal(t)&&!(v>0)){tg&&tg.showAlert?tg.showAlert('Укажи значение'):alert('Укажи значение');return}const ok=await post('alerts',{name:n,type:t,value:v});const m=ok?'Готово. '+$('#rp').textContent+' Бот напишет в личку.':'Не удалось создать правило';tg&&tg.showAlert?tg.showAlert(m):alert(m);if(ok&&S.tab==='fav')go()}
